# CI for dzPanel. NOT YET RUN on GitHub: written from the commands that were run locally
# (docs/development-setup.md). Action and container tags are unverified; check them on the first run.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:   # the release workflow runs the same checks first

permissions:
  contents: read

jobs:
  host:
    # C code, ASAN + UBSAN, -Werror (set in CMakeLists.txt), all ctest targets, no simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DRU_BUILD_SIM=OFF
      - run: cmake --build build -j4
      - run: ctest --test-dir build --output-on-failure

  script-modes:
    # shell scripts must be committed as mode 100755 (a Windows checkout hides a missing exec bit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git ls-files -s '*.sh' | awk '$1 != "100755"{print; bad=1} END{exit bad}'

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tests/site/test_lib.mjs
      - run: node sim/mock/test_mock.js
      - run: python3 -I -W ignore tests/tools/test_make_manifest.py
      - run: python3 -I -W ignore tests/tools/test_release_tools.py   # version rules, site audit, pulling a build
      - run: node --check site/app.js

  simulator:
    # LVGL v9.4.0 from vendor.lock + SDL2; renders every screen at 466 and 480 and checks the circle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - run: bash tools/fetch_vendor.sh
      - run: cmake -S . -B build-sim -DRU_BUILD_SIM=ON
      - run: cmake --build build-sim -j4
      - run: ctest --test-dir build-sim --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: sim/screenshots/*.png

  firmware:
    # ESP-IDF v5.5.6 build for the 1.75" board. The image tag is unverified.
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@v4
      - name: build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware
          idf.py set-target esp32s3
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-amoled-175
          path: |
            firmware/build/*.bin
            firmware/build/flasher_args.json

  secrets-scan:
    # fail if a Domoticz-style token or a private URL slipped into tracked files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scan
        run: |
          ! grep -rInE 'eyJ[A-Za-z0-9_-]{15,}\.[A-Za-z0-9_-]{15,}\.' --exclude-dir=.git --exclude-dir=vendor --exclude-dir=build --exclude-dir=managed_components . \
            | grep -v 'c2lnbmF0dXJl' || { echo "possible token in the tree"; exit 1; }   # c2lnbmF0dXJl = the base64 of 'signature', the fake signature used by the test tokens
